[platformio]
src_dir = Src
include_dir = Inc

[env:stm32f401cc_usb_dfu]
platform = ststm32
board = genericSTM32F401CC
framework = stm32cube

; ; Keep using the CubeMX-generated memory layout.
board_build.ldscript = STM32F401CCUX_FLASH.ld

; PlatformIO's STM32Cube framework supplies CMSIS, HAL and startup code.
; Add only the USB middleware generated by CubeMX, and avoid compiling the
; duplicate CubeMX system file from Src/.
build_src_filter =
    +<*>
    -<system_stm32f4xx.c>
    +<../Middlewares/ST/STM32_USB_Device_Library/Core/Src/*.c>
    +<../Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Src/*.c>

build_flags =
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include
    -IDrivers/STM32F4xx_HAL_Driver/Inc
    -IMiddlewares/ST/STM32_USB_Device_Library/Core/Inc
    -IMiddlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
    -DSTM32F401xC
    -DUSE_HAL_DRIVER

; ; Upload through the STM32 ROM DFU bootloader over the board's USB-C port.
; ; Enter it by holding BOOT0 high, resetting/powering the board, then run upload.
upload_protocol = dfu